<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d2a27">
<title>碼農籤筒</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: single centered column at every width. Single night-temple look on purpose. */
:root {
  color-scheme: dark;
  --night: #0d2a27;        /* deep jade night */
  --night-2: #123a35;
  --panel: rgba(9, 30, 28, .72);
  --line: rgba(232, 200, 120, .28);
  --gold: #e8c878;
  --gold-soft: #b99a52;
  --cinnabar: #d9442f;
  --paper: #f5ecd2;
  --ink: #2a2118;
  --ink-soft: #6d5d47;
  --text: #ecf1ea;
  --muted: #9fb7ae;
  --good: #7fd6a4;
  --bad: #ff8a73;
  --display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(1200px 600px at 50% -10%, rgba(232, 200, 120, .16), transparent 60%),
    linear-gradient(180deg, var(--night-2), var(--night) 55%);
  background-color: var(--night);
  background-attachment: fixed;
  color: var(--text);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 6px; }

.page {
  max-width: 1120px; margin: 0 auto; padding-block: 24px 48px;
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px;
}
@media (min-width: 960px) { .page { padding-block: 56px 64px; } }

/* ---------- hero ---------- */
.hero { text-align: center; display: grid; justify-items: center; gap: 6px; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; color: var(--gold-soft); text-transform: uppercase; }
h1 {
  margin: 0; font-family: var(--display); font-weight: 900; color: var(--gold);
  font-size: clamp(40px, 9vw, 64px); line-height: 1.1; letter-spacing: .12em; text-wrap: balance;
  text-shadow: 0 2px 0 rgba(0,0,0,.35);
}
.date { font-family: var(--display); color: var(--muted); font-size: 15px; letter-spacing: .08em; }

.altar { margin-top: 18px; display: grid; justify-items: center; gap: 18px; }
.tube-btn {
  appearance: none; border: 0; background: none; padding: 0; cursor: pointer;
  width: 190px; height: 300px; position: relative; touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.tube-btn:disabled { cursor: progress; }
.sticks { position: absolute; left: 50%; bottom: 150px; width: 130px; height: 140px; transform: translateX(-50%); }
.stick {
  position: absolute; bottom: 0; width: 11px; height: 150px; border-radius: 3px 3px 1px 1px;
  background: linear-gradient(90deg, #c49a5a, #e7c88d 45%, #b58948);
  box-shadow: inset 0 0 0 1px rgba(80, 50, 10, .35);
  transform-origin: 50% 100%;
  transition: transform .45s cubic-bezier(.2, 1.4, .4, 1);
}
.stick::before { content: ""; position: absolute; top: 6px; left: 2px; right: 2px; height: 22px; background: var(--cinnabar); border-radius: 2px; opacity: .85; }
.stick.out { transform: translateY(-78px) rotate(0deg) !important; z-index: 2; box-shadow: 0 0 18px rgba(232, 200, 120, .9), inset 0 0 0 1px rgba(80,50,10,.35); }
.tube {
  position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
  width: 150px; height: 175px; border-radius: 10px 10px 22px 22px;
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,.08) 0 2px, transparent 2px 26px),
    linear-gradient(90deg, #6b1d14, #b5321f 30%, #d9442f 50%, #a72d1b 72%, #5d170f);
  box-shadow: 0 24px 40px rgba(0,0,0,.45), inset 0 -10px 0 rgba(0,0,0,.18);
  display: grid; place-items: center;
}
.tube::before {
  content: ""; position: absolute; top: -9px; left: -6px; right: -6px; height: 18px; border-radius: 50%;
  background: radial-gradient(ellipse at 50% 40%, #2a0b06 55%, #e8c878 57%, #b99a52 75%);
}
.tube::after { content: ""; position: absolute; left: 0; right: 0; top: 34px; height: 6px; background: linear-gradient(90deg, #8a6a2c, #e8c878, #8a6a2c); opacity: .9; }
.tube-label {
  font-family: var(--display); font-weight: 900; color: var(--gold);
  writing-mode: vertical-rl; font-size: 28px; letter-spacing: .2em; margin-top: 18px;
  text-shadow: 0 1px 0 rgba(0,0,0,.4);
}
.tube-btn.shaking .tube-body { animation: shake .16s ease-in-out infinite alternate; }
.tube-body { position: absolute; inset: 0; transform-origin: 50% 95%; }
@keyframes shake { from { transform: rotate(-9deg) translateX(-4px); } to { transform: rotate(9deg) translateX(4px); } }
.tube-btn.shaking .stick { animation: rattle .12s linear infinite alternate; }
@keyframes rattle { to { margin-bottom: 8px; } }

.draw-btn {
  appearance: none; border: 1px solid var(--gold); cursor: pointer;
  background: linear-gradient(180deg, #e8c878, #c9a253); color: #2a1a06;
  font-family: var(--display); font-weight: 900; font-size: 20px; letter-spacing: .3em;
  padding: 12px 34px 12px 40px; border-radius: 999px; min-height: 52px;
  box-shadow: 0 8px 22px rgba(232, 200, 120, .25);
  touch-action: manipulation;
}
.draw-btn:active { transform: translateY(1px); }
.draw-btn:disabled { opacity: .6; cursor: progress; }
.hint { color: var(--muted); font-size: 13px; margin: 0; }
kbd { font-family: var(--mono); font-size: 12px; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
@media (hover: none) { .kbd-hint { display: none; } }

/* ---------- fortune card ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
  background: rgba(4, 14, 13, .72); backdrop-filter: blur(3px);
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  overflow-y: auto;
}
.card {
  width: 100%; max-width: 460px; background: var(--paper); color: var(--ink);
  border-radius: 6px; padding: 26px 22px 20px; position: relative;
  box-shadow: 0 30px 60px rgba(0,0,0,.5), inset 0 0 0 6px var(--paper), inset 0 0 0 7px rgba(42,33,24,.35);
  animation: rise .45s cubic-bezier(.2, 1.2, .4, 1);
}
@keyframes rise { from { transform: translateY(24px) scale(.96); opacity: 0; } }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.card-no { font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: .12em; color: var(--ink-soft); }
.card-no b { font-size: 26px; color: var(--ink); font-variant-numeric: tabular-nums; }
.stamp {
  font-family: var(--display); font-weight: 900; font-size: 46px; line-height: 1; color: var(--cinnabar);
  border: 4px solid var(--cinnabar); border-radius: 8px; padding: 6px 10px 8px; transform: rotate(-6deg);
  letter-spacing: .04em; mix-blend-mode: multiply;
}
.card[data-tone="bad"] .stamp { color: #3a3a3a; border-color: #3a3a3a; }
.verdict { margin: 14px 0 12px; font-size: 14px; color: var(--ink-soft); }
.poem {
  margin: 0 0 16px; padding: 14px 0; border-block: 1px solid rgba(42,33,24,.25);
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px;
  font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: .1em; text-align: center;
}
.yiji { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.yiji div { border: 1px solid rgba(42,33,24,.22); border-radius: 6px; padding: 8px 10px; }
.yiji h3 { margin: 0 0 4px; font-family: var(--display); font-weight: 900; font-size: 18px; }
.yi h3 { color: #2f7a4c; } .ji h3 { color: var(--cinnabar); }
.yiji ul { margin: 0; padding-left: 16px; font-size: 13px; line-height: 1.55; }
.lucky { margin-top: 12px; display: grid; grid-template-columns: auto minmax(0,1fr); gap: 4px 12px; font-size: 13px; }
.lucky dt { color: var(--ink-soft); }
.lucky dd { margin: 0; overflow-wrap: anywhere; }
.lucky code { font-family: var(--mono); font-size: 12.5px; background: rgba(42,33,24,.08); padding: 1px 6px; border-radius: 4px; }
.actions { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 8px; }
.actions button {
  appearance: none; flex: 1 1 auto; min-height: 44px; border-radius: 8px; cursor: pointer;
  border: 1px solid rgba(42,33,24,.35); background: transparent; color: var(--ink); font-weight: 500; padding: 8px 14px;
}
.actions .primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.close-x {
  position: absolute; top: 6px; right: 8px; width: 40px; height: 40px; border: 0; background: none;
  font-size: 24px; line-height: 1; color: var(--ink-soft); cursor: pointer;
}

.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--paper); color: var(--ink); padding: 8px 16px; border-radius: 999px; font-size: 14px; z-index: 30;
  box-shadow: 0 10px 24px rgba(0,0,0,.35);
}

@media (max-width: 420px) {
  .tube-btn { width: 160px; height: 270px; }
  .tube { width: 128px; height: 158px; }
  .sticks { bottom: 136px; width: 110px; }
  .stick { height: 132px; }
  .stamp { font-size: 38px; }
  .poem { font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  .tube-btn.shaking .tube-body, .tube-btn.shaking .stick, .card { animation: none !important; }
  .stick { transition: none; }
}
</style>
</head>
<body>
<div class="page">
  <section class="hero" aria-labelledby="title">
    <span class="eyebrow">daily fortune · v1.0.0</span>
    <h1 id="title">碼農籤筒</h1>
    <div class="date" id="today"></div>

    <div class="altar">
      <button class="tube-btn" id="tube" type="button" aria-label="搖籤筒抽籤">
        <span class="tube-body">
          <span class="sticks" id="sticks"></span>
          <span class="tube"><span class="tube-label">諸事順利</span></span>
        </span>
      </button>
      <button class="draw-btn" id="drawBtn" type="button">求一支籤</button>
      <p class="hint">點籤筒或按鈕就會搖籤<span class="kbd-hint">，也可以按 <kbd>空白鍵</kbd></span>。</p>
    </div>
  </section>

</div>

<div class="overlay" id="overlay" hidden>
  <article class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="cardLevel">
    <button class="close-x" id="closeX" type="button" aria-label="關閉">×</button>
    <div class="card-top">
      <div class="card-no">第 <b id="cardNo"></b> 籤</div>
      <div class="stamp" id="cardLevel"></div>
    </div>
    <p class="verdict" id="cardVerdict"></p>
    <div class="poem" id="cardPoem"></div>
    <div class="yiji">
      <div class="yi"><h3>宜</h3><ul id="cardYi"></ul></div>
      <div class="ji"><h3>忌</h3><ul id="cardJi"></ul></div>
    </div>
    <dl class="lucky">
      <dt>幸運指令</dt><dd><code id="cardCmd"></code></dd>
      <dt>幸運飲料</dt><dd id="cardDrink"></dd>
    </dl>
    <div class="actions">
      <button class="primary" id="againBtn" type="button">再抽一次</button>
      <button id="copyBtn" type="button">複製籤詩</button>
      <button id="closeBtn" type="button">收下</button>
    </div>
  </article>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const LEVELS = [
    { k: '大吉', w: 8,  tone: 'top', verdict: '天時地利人和，今天寫的每一行都會被記住（是好的那種）。', poems: [
      ['綠燈一路到天邊', '需求凍結不再變', '上線零錯人人誇', '準時下班看夕陽'],
      ['一行修好千年坑', '同事讚嘆如神明', '主管加薪不用等', '今夜好夢到天明'] ] },
    { k: '中吉', w: 16, tone: 'top', verdict: '運勢穩健，小有收穫，適合推進卡了很久的工作。', poems: [
      ['程式雖亂尚能跑', '小改幾行問題消', '會議只開半小時', '午後咖啡格外香'],
      ['文件寫得有人看', '審查一次就過關', '偶有警告莫理它', '收工之前心自安'] ] },
    { k: '小吉', w: 20, tone: 'mid', verdict: '小順小卡，耐心是今天的關鍵字。', poems: [
      ['編譯稍慢且耐心', '快取清掉便如新', '錯誤訊息雖難讀', '搜尋三次見真因'],
      ['晨間站會話不多', '小票三張穩穩過', '若遇合併有衝突', '先拉再推莫蹉跎'] ] },
    { k: '吉', w: 22, tone: 'mid', verdict: '平平安安的一天，照規矩來就不會出事。', poems: [
      ['今日平安少驚喜', '日誌乾淨如白紙', '循規蹈矩寫單元', '明天自有好運氣'],
      ['需求小改不算多', '改完還有時間摸', '莫在週五動正式', '平平順順過一日'] ] },
    { k: '末吉', w: 16, tone: 'mid', verdict: '先苦後甘，上午卡關下午解，晚一點收工也值得。', poems: [
      ['先苦後甘需等待', '環境掛了又重開', '午後終得修好它', '晚點下班也應該'],
      ['套件升級連環爆', '版本相依纏成套', '鎖定版號保平安', '黃昏時分見曙光'] ] },
    { k: '凶', w: 12, tone: 'bad', verdict: '今天容易踩雷，重要變更請多找一個人看過。', poems: [
      ['線上警報半夜響', '日誌翻遍無蹤影', '回滾版本先止血', '明日再查莫逞強'],
      ['需求今天又改了', '昨天寫的全白搞', '深呼吸後重來過', '記得先把分支保'] ] },
    { k: '大凶', w: 6, tone: 'bad', verdict: '建議今天只讀不寫。真的要動，先備份，再備份一次。', poems: [
      ['週五下午動正式', '資料庫裡少一表', '備份不知在何處', '速速求救莫自找'],
      ['強推主幹蓋歷史', '同事心血全消失', '急翻紀錄能救回', '今日諸事皆不宜'] ] },
  ];
  const YI = ['重構舊程式', '補單元測試', '清技術債', '認真 Code Review', '部署上線', '升級套件', '寫文件', '在會議上提問',
    '請同事喝飲料', '準時下班', '合併分支', '刪掉沒用的程式', '學一個新框架', '結對寫程式', '整理待辦票'];
  const JI = ['週五部署', 'force push main', '直接改正式資料庫', '相信「應該沒問題」', '估時太樂觀', '跳過測試',
    'commit 訊息只寫 fix', '熬夜趕工', '臨時加需求', '複製貼上不看內容', '半夜回訊息', '關掉警報', '說「這個很快」'];
  const CMDS = ['git pull --rebase', 'git bisect', 'npm ci', 'git log --oneline', 'docker compose up -d', 'kubectl get pods',
    'git stash pop', 'console.log("here")', 'Ctrl + Z', 'git commit --amend', 'make test', 'curl -I'];
  const DRINKS = ['珍奶半糖少冰', '冰美式', '無糖綠茶', '冬瓜檸檬', '熱拿鐵', '多多綠', '燕麥奶茶', '一杯白開水'];

  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const pickN = (arr, n) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a.slice(0, n); };

  function rollFortune() {
    const total = LEVELS.reduce((s, l) => s + l.w, 0);
    let r = Math.random() * total, lvl = LEVELS[0];
    for (const l of LEVELS) { if ((r -= l.w) < 0) { lvl = l; break; } }
    return {
      no: 1 + Math.floor(Math.random() * 64),
      level: lvl.k, tone: lvl.tone, verdict: lvl.verdict, poem: pick(lvl.poems),
      yi: pickN(YI, 3), ji: pickN(JI, 3), cmd: pick(CMDS), drink: pick(DRINKS),
    };
  }

  // ---------- date ----------
  const now = new Date();
  const pad = (n) => String(n).padStart(2, '0');
  const TODAY = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
  const WEEK = '日一二三四五六';
  $('today').textContent = `${now.getFullYear()} 年 ${now.getMonth() + 1} 月 ${now.getDate()} 日 · 星期${WEEK[now.getDay()]}`;

  // ---------- sticks ----------
  const sticksEl = $('sticks');
  const STICK_COUNT = 11;
  for (let i = 0; i < STICK_COUNT; i++) {
    const s = document.createElement('span');
    s.className = 'stick';
    const x = 8 + i * ((130 - 26) / (STICK_COUNT - 1));
    const rot = (i - (STICK_COUNT - 1) / 2) * 2.4;
    s.style.left = x + 'px';
    s.style.transform = `rotate(${rot}deg) translateY(${(i % 3) * 6}px)`;
    sticksEl.appendChild(s);
  }

  // ---------- draw ----------
  const tube = $('tube'), drawBtn = $('drawBtn'), overlay = $('overlay');
  let busy = false, current = null;

  async function draw() {
    if (busy) return;
    busy = true; tube.disabled = drawBtn.disabled = true;
    closeCard();
    sticksEl.querySelectorAll('.out').forEach((s) => s.classList.remove('out'));
    tube.classList.add('shaking');
    await sleep(reduced ? 150 : 1300);
    tube.classList.remove('shaking');
    const f = rollFortune();
    const sticks = sticksEl.children;
    sticks[Math.floor(Math.random() * sticks.length)].classList.add('out');
    await sleep(reduced ? 100 : 650);
    showCard(f);
    busy = false; tube.disabled = drawBtn.disabled = false;
  }

  function fillList(ul, items) { ul.replaceChildren(...items.map((t) => { const li = document.createElement('li'); li.textContent = t; return li; })); }

  function showCard(f) {
    current = f;
    $('card').dataset.tone = f.tone;
    $('cardNo').textContent = f.no;
    $('cardLevel').textContent = f.level;
    $('cardVerdict').textContent = f.verdict;
    $('cardPoem').replaceChildren(...f.poem.map((l) => { const s = document.createElement('span'); s.textContent = l; return s; }));
    fillList($('cardYi'), f.yi);
    fillList($('cardJi'), f.ji);
    $('cardCmd').textContent = f.cmd;
    $('cardDrink').textContent = f.drink;
    overlay.hidden = false;
    $('againBtn').focus({ preventScroll: true });
  }
  function closeCard() { if (!overlay.hidden) { overlay.hidden = true; drawBtn.focus({ preventScroll: true }); } }

  tube.addEventListener('click', draw);
  drawBtn.addEventListener('click', draw);
  $('againBtn').addEventListener('click', draw);
  $('closeBtn').addEventListener('click', closeCard);
  $('closeX').addEventListener('click', closeCard);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeCard(); });
  addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeCard();
    if (e.code === 'Space' && !e.target.closest('button, a, input, textarea')) { e.preventDefault(); draw(); }
  });

  const toast = (msg) => { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 1800); };
  $('copyBtn').addEventListener('click', async () => {
    if (!current) return;
    const f = current;
    const text = `【碼農籤筒】${TODAY}\n第 ${f.no} 籤 · ${f.level}\n${f.poem.join('，')}\n宜：${f.yi.join('、')}\n忌：${f.ji.join('、')}\n幸運指令：${f.cmd}　幸運飲料：${f.drink}`;
    try { await navigator.clipboard.writeText(text); toast('已複製籤詩'); }
    catch { const r = document.createRange(); r.selectNodeContents($('card')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('已選取籤詩，請手動複製'); }
  });

})();
</script>
</body>
</html>
